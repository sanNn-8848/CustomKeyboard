name: Build Release APK


on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write


    steps:
    - uses: actions/checkout@v4


    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle


    - name: Grant execute permission for gradlew
      run: chmod +x gradlew


    - name: Build Release APK
      run: ./gradlew assembleRelease


    - name: Sign APK
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}


    - name: Rename APK
      run: |
        mv ${{ steps.sign_app.outputs.signedReleaseFile }} MeroType.apk


    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: MeroType.apk
        body: |
          ## MeroType - Roman Nepali Keyboard
          
          ### Installation Instructions:
          1. Download `MeroType.apk`
          2. Go to Settings > Apps > Special app access > Install unknown apps
          3. Enable "Files" or "Chrome" (browser used to download)
          4. Open the APK file and tap Install
          5. Go to Settings > Languages & input > Virtual keyboard
          6. Select and enable "MeroType Keyboard"
          7. Start typing in Roman Nepali!
          
          ### Features:
          - Offline Roman Nepali keyboard
          - Smart suggestions (50,000+ words)
          - Learns from your typing
          - No internet required
          - 100% privacy (local data only)
          - Works on Android 5.0+
          
          ### Changelog:
          See CHANGELOG.md for detailed changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
